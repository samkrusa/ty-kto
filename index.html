<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>ТЫ кто?</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0d;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  .question {
    /* масштабируется от ширины экрана и от высоты, чтобы влезало и на телефоне, и на ПК */
    font-size: clamp(2rem, 18vmin, 22rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    text-align: center;
    white-space: nowrap;
    padding: 0 4vmin;
    background: linear-gradient(180deg, #ffffff 0%, #a9a9b8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    user-select: none;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.02); }
  }

  @media (prefers-reduced-motion: reduce) {
    .question { animation: none; }
  }
</style>
</head>
<body>
  <h1 class="question">ТЫ кто?</h1>
</body>
</html>
